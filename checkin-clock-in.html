<!DOCTYPE html>
<html>
<head>
  <title>Clock In</title>
  <script>
    function submitWithLocation() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(function(pos) {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const gps = lat + "," + lng;

        const formURL = `https://docs.google.com/forms/d/e/1FAIpQLSe0gjDBCkXBQSWT59J3B6YVSUWXZTv2cvCnJcr3JM4Ud38Pkg/viewform?entry.179900295=Clock+In&entry.1354044478=` + encodeURIComponent(gps);
        window.location.href = formURL;
      }, function(err) {
        alert("Error getting location: " + err.message);
      });
    }
  </script>
</head>
<body onload="submitWithLocation()">
  <h2>Clock In – Please wait while we capture your location…</h2>
  <p>If you are not redirected, make sure location services are enabled.</p>
</body>
</html>
